name: Source checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      research:
        description: Run isolated adaptive Rust unit and audit-contract checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]' -c requirements/validated-windows-cp314t.txt
      - run: python -B scripts/check_environment.py
      - run: python -B scripts/check_suites.py python

  desktop-native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14t'
      - run: rustup default stable
      - run: rustup component add rustfmt
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -e '.[dev,native]' -c requirements/validated-windows-cp314t.txt
      - run: .venv/Scripts/python.exe -B scripts/build_native.py
      - run: cargo build --release --manifest-path rust/solar_core/Cargo.toml
      - run: .venv/Scripts/python.exe -B scripts/check_suites.py desktop

  adaptive-research:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.research }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]' -c requirements/validated-windows-cp314t.txt
      - run: python -B scripts/check_suites.py adaptive
